<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.18.1/axios.js"></script>
    <title>Random User Axios</title>

<style>
body {
    margin: 0;
    padding: 30px;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #1a73e8, #00c6ff);
    display: flex;
    justify-content: center;
}

.tarjeta {
    width: 90%;
    max-width: 1200px;
    background: #fff;
    border-radius: 20px;
    padding: 35px;
    box-shadow: 0 10px 30px rgba(0,0,0,.2);
}

.tarjeta h1 {
    text-align: center;
    margin-bottom: 25px;
    font-size: 35px;
    color: #222;
}

.decoracion {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.tarjeta img {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    border: 5px solid #0d6efd;
    object-fit: cover;
}

.lado {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 120px;
}

.lado span {
    height: 10px;
    background: #0d6efd;
    border-radius: 30px;
}

.lado span:nth-child(1) {
    width: 120px;
}

.lado span:nth-child(2) {
    width: 80px;
}

.lado span:nth-child(3) {
    width: 40px;
}

.izquierdo span {
    margin-right: auto;
}

.derecho span {
    margin-left: auto;
}

.separador {
    border: none;
    border-top: 3px solid #0d6efd;
    margin: 30px 0;
}

.categoria {
    margin-bottom: 35px;
}

.categoria h2 {
    margin-bottom: 18px;
    color: #0d6efd;
    border-left: 6px solid #0d6efd;
    padding-left: 12px;
    font-size: 22px;
}

.datos {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 15px;
}

.datos p {
    margin: 0;
    padding: 15px;
    background: #f8f9fa;
    border-left: 5px solid #0d6efd;
    border-radius: 10px;
    box-shadow: 0 3px 8px rgba(0,0,0,.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    transition: .3s;
}

.botones {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 35px;
    flex-wrap: wrap;
}

.botones button {
    padding: 14px 28px;
    border: none;
    border-radius: 10px;
    background: #0d6efd;
    color: white;
    font-size: 15px;
    cursor: pointer;
    transition: .3s;
}

.botones button:hover {
    background: #084298;
}

@media (max-width: 900px){

    .datos{
        grid-template-columns:1fr;
    }

    .decoracion{
        flex-direction:column;
        gap:20px;
    }

    .lado{
        flex-direction:row;
        width:auto;
    }

    .izquierdo span,
    .derecho span{
        margin:0;
    }
}


@media (max-width:600px){

    body{
        padding:15px;
    }

    .tarjeta{
        padding:20px;
    }

    .tarjeta h1{
        font-size:28px;
    }

    .tarjeta img{
        width:120px;
        height:120px;
    }

    .categoria h2{
        font-size:19px;
    }

    .datos p{
        flex-direction:column;
        align-items:flex-start;
        gap:8px;
    }

    .botones{
        flex-direction:column;
    }

    .botones button{
        width:100%;
    }
}
</style>
</head>
<body>

    <div class="tarjeta">

        <h1 id="nombre"></h1>

        <div class="decoracion">
            <div class="lado izquierdo">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <img id="perfil" alt="Foto de perfil">

            <div class="lado derecho">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <hr class="separador">

        <div class="categoria">
            <h2>Información personal</h2>

            <div class="datos">

                <p id="username"></p>
                <p id="genero"></p>
                <p id="edad"></p>
                <p id="nacimiento"></p>
                <p id="titulo"></p>
                <p id="nacionalidad"></p>

            </div>
        </div>

        <div class="categoria">
            <h2>Contacto</h2>

            <div class="datos">

                <p id="correo"></p>
                <p id="telefono"></p>
                <p id="celular"></p>

            </div>
        </div>

        <div class="categoria">
            <h2>Ubicación</h2>

            <div class="datos">

                <p id="direccion"></p>
                <p id="ciudad"></p>
                <p id="departamento"></p>
                <p id="postal"></p>
                <p id="pais"></p>
                <p id="latitud"></p>
                <p id="longitud"></p>
                <p id="horario"></p>

            </div>
        </div>

        <div class="categoria">
            <h2>Cuenta</h2>

            <div class="datos">

                <p id="registro"></p>
                <p id="registro1"></p>
                <p id="uuid"></p>

            </div>
        </div>

        <div class="categoria">
            <h2>Seguridad</h2>

            <div class="datos">

                <p id="password"></p>
                <p id="documento"></p>
                <p id="numero"></p>
                <p id="salt"></p>
                <p id="hashes"></p>

            </div>
        </div>

        <div class="botones">
            <button id="maps">Ver ubicación en Google Maps</button>
        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async()=>{
            let res = await axios.get("https://randomuser.me/api/")
            console.log(res);

            let usuario = res.data.results[0];

            let nombre = document.getElementById("nombre");
            nombre.textContent = `${usuario.name.first} ${usuario.name.last}`;

            let perfil = document.getElementById("perfil")
            perfil.src = `${usuario.picture.large}`;
            perfil.alt = `Foto de perfil de ${usuario.name.first} ${usuario.name.last}`;

            let username = document.getElementById("username");
            username.textContent = `Nombre de usuario: ${usuario.login.username}`;

            let correo = document.getElementById("correo");
            correo.textContent = `Correo: ${usuario.email}`;

            let password = document.getElementById("password");
            password.textContent = `Contraseña: ${usuario.login.password}`;

            let nacimiento = document.getElementById("nacimiento");
            nacimiento.textContent = `Fecha de nacimiento: ${usuario.dob.date.substring(0,10)}`;

            let edad = document.getElementById("edad");
            edad.textContent = `Edad: ${usuario.dob.age} años`;

            let genero = document.getElementById("genero");
            genero.textContent = `Genero: ${usuario.gender}`;

            let telefono = document.getElementById("telefono");
            telefono.textContent = `Telefono: ${usuario.phone}`;

            let celular = document.getElementById("celular");
            celular.textContent = `Celular: ${usuario.cell}`;

            let direccion = document.getElementById("direccion");
            direccion.textContent = `Direccion: ${usuario.location.street.number}, ${usuario.location.street.name}`;

            let ciudad = document.getElementById("ciudad");
            ciudad.textContent = `Ciudad: ${usuario.location.city}`;

            let postal = document.getElementById("postal");
            postal.textContent = `Codigo postal: ${usuario.location.postcode}`;

            let departamento = document.getElementById("departamento");
            departamento.textContent = `Departamento: ${usuario.location.state}`;
            
            let pais = document.getElementById("pais");
            pais.textContent = `Pais: ${usuario.location.country}`;

            let registro = document.getElementById("registro");
            registro.textContent = `Fecha de registro: ${usuario.registered.date}`;

            let registro1 = document.getElementById("registro1");
            registro1.textContent = `Años registrado: ${usuario.registered.age}`;

            let nacionalidad = document.getElementById("nacionalidad");
            nacionalidad.textContent = `Nacionalidad: ${usuario.nat}`;

            let latitud = document.getElementById("latitud");
            latitud.textContent = `Latitud: ${usuario.location.coordinates.latitude}`;

            let longitud = document.getElementById("longitud");
            longitud.textContent = `Longitud: ${usuario.location.coordinates.longitude}`;

            let horario = document.getElementById("horario");
            horario.textContent = `Zona horaria: ${usuario.location.timezone.offset} ${usuario.location.timezone.description}`;

            let documento = document.getElementById("documento");
            documento.textContent = `Tipo de documento: ${usuario.id.name}`;

            let numero = document.getElementById("numero");
            numero.textContent = `Numero de documento: ${usuario.id.value}`;

            let titulo = document.getElementById("titulo");
            titulo.textContent = `Tratamiento: ${usuario.name.title}`;

            let uuid = document.getElementById("uuid");
            uuid.textContent = `UUID: ${usuario.login.uuid}`;

            let salt = document.getElementById("salt");
            salt.textContent = `Salt: ${usuario.login.salt}`;

            let hashes = document.getElementById("hashes");
            hashes.textContent = `Hashes: ${usuario.login.md5} ${usuario.login.sha1} ${usuario.login.sha256}`

        let maps = document.getElementById("maps");
        maps.addEventListener("click", () => {

            const latitud = usuario.location.coordinates.latitude;
            const longitud = usuario.location.coordinates.longitude;

            window.open(
                `https://www.google.com/maps?q=${latitud},${longitud}`,
                "_blank"
            );
        })
        })
      
    </script>

</body>
</html>
