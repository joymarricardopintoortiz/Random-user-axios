<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.18.1/axios.js"></script>
    <title>Random User Axios</title>

    <link rel="stylesheet" href="./styles.css">
</head>
<body>

    <div class="tarjeta">

        <h1 id="nombre"></h1>

        <div class="decoracion">
            <div class="lado izquierdo">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <img id="perfil" alt="Foto de perfil">

            <div class="lado derecho">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <hr class="separador">

        <div class="categoria">
            <h2>Información personal</h2>

            <div class="datos">

                <p id="username"></p>
                <p id="genero"></p>
                <p id="edad"></p>
                <p id="nacimiento"></p>
                <p id="titulo"></p>
                <p id="nacionalidad"></p>

            </div>
        </div>

        <div class="categoria">
            <h2>Contacto</h2>

            <div class="datos">

                <p id="correo"></p>
                <p id="telefono"></p>
                <p id="celular"></p>

            </div>
        </div>

        <div class="categoria">
            <h2>Ubicación</h2>

            <div class="datos">

                <p id="direccion"></p>
                <p id="ciudad"></p>
                <p id="departamento"></p>
                <p id="postal"></p>
                <p id="pais"></p>
                <p id="latitud"></p>
                <p id="longitud"></p>
                <p id="horario"></p>

            </div>
        </div>

        <div class="categoria">
            <h2>Cuenta</h2>

            <div class="datos">

                <p id="registro"></p>
                <p id="registro1"></p>
                <p id="uuid"></p>

            </div>
        </div>

        <div class="categoria">
            <h2>Seguridad</h2>

            <div class="datos">

                <p id="password"></p>
                <p id="documento"></p>
                <p id="numero"></p>
                <p id="salt"></p>
                <p id="hashes"></p>

            </div>
        </div>

        <div class="botones">
            <button id="maps">Ver ubicación en Google Maps</button>
        </div>

    </div>

    <script src="./script.js"></script>

</body>
</html>
